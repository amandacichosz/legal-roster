<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Legal Bench logo — Option 3</title>
  <desc id="desc">A clean home plate badge containing an LB monogram with Legal Bench wordmark.</desc>

  <style>
    text { font-family: Arial, Helvetica, sans-serif; }
  </style>

  <!-- Badge -->
  <g transform="translate(65 70)">
    <path d="M35 0 H255 Q270 0 270 15 V145
             L145 270 L20 145 V15 Q20 0 35 0 Z"
          fill="none" stroke="#0B2A4A" stroke-width="12" stroke-linejoin="round"/>

    <!-- LB monogram -->
    <g transform="translate(66 56)">
      <path d="M0 0 H22 V98 H84 V120 H0 Z" fill="#0B2A4A"/>
      <path d="M62 20 H104 C128 20 143 32 143 52
               C143 65 137 75 126 80
               C140 86 149 98 149 113
               C149 137 132 152 105 152 H62 Z
               M84 42 V69 H102 C114 69 121 64 121 55
               C121 46 114 42 102 42 Z
               M84 91 V130 H104 C118 130 126 123 126 110
               C126 97 118 91 104 91 Z" fill="#1E73E8"/>
    </g>

    <!-- Home plate accent -->
    <rect x="133" y="220" width="24" height="24" transform="rotate(45 145 232)" fill="#1E73E8"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(390 120)">
    <text x="0" y="60" font-size="66" font-weight="700" letter-spacing="3" fill="#0B2A4A">LEGAL</text>
    <text x="0" y="132" font-size="66" font-weight="700" letter-spacing="3" fill="#1E73E8">BENCH</text>
  </g>
</svg>
